[pytest]
# Point pytest-cov at the project coverage config (coverage.py ignores pytest.ini for [run]/[html]).
addopts = --cov-config=.coveragerc

cache_dir = /tmp/.pytest_cache

# NB: setting norecursedirs overrides pytest's built-in defaults entirely, so we
# re-list them explicitly alongside our own heavy/irrelevant directories to keep
# collection from walking .venv, .tox, .git, dist, htmlcov, etc.
norecursedirs = 
    *.egg
    .*
    _darcs
    build
    CVS
    {arch}
    node_modules
    venv
    dist
    htmlcov
    core/python/interactivity
