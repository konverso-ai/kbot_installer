name: Test Build Release
run-name: "${{github.ref_name}} -- Test Build Release"

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-3
  VERSION: ${{ github.ref_name }}

jobs:
  pre-test:
    name: Pre Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit message
        run: |
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_MSG=$(git show --no-patch --format="%s" $PR_HEAD_SHA)
          echo "Commit message: '$COMMIT_MSG'"
          
            VALID_PREFIXES="build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test"
            VALID_JIRA_PROJECTS="CS|DO|INFRA|KB"
            
            if echo "$COMMIT_MSG" | grep -qE "^($VALID_PREFIXES)\\(($VALID_JIRA_PROJECTS)-[0-9]+\\): .+"; then
              echo -e "\033[32m++ Commit message format is valid: $COMMIT_MSG\033[39m"
            elif echo "$COMMIT_MSG" | grep -qE "^(Merge|Auto merge:) "; then
              echo -e "\033[32m++ Merge commit detected, skipping validation: $COMMIT_MSG\033[39m"
            else
              echo -e "\033[33m++ Invalid commit message format: $COMMIT_MSG\033[39m"
              echo "Expected format: <prefix>(<jira-project-id>-12345): <message>"
              echo "Valid prefixes: $VALID_PREFIXES"
              echo "Valid JIRA projects: $VALID_JIRA_PROJECTS"
              echo "Example: feat(KB-123): add new feature"
              echo "Example: fix(DO-456): fix bug"
              exit 1
            fi

      - name: Orca - Set repository name
        run: |
          ORCA_PROJECT_KEY=$(echo "${{ github.repository }}" | sed 's/\//-/g')
          echo "ORCA_PROJECT_KEY=$ORCA_PROJECT_KEY" >> $GITHUB_ENV

      - name: Orca - SAST Scan
        run: |
          curl -sfL 'https://raw.githubusercontent.com/orcasecurity/orca-cli/main/install.sh' | bash
          orca-cli --project-key ${{ env.ORCA_PROJECT_KEY }} sast scan --path . -k ${{ secrets.ORCA_SECURITY_API_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_P }}
          role-duration-seconds: 3600

      - name: Authenticate uv with AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain konverso \
            --domain-owner 872515286329 \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "UV_INDEX_KONVERSO_AWS_PRIVATE_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PRIVATE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: uv sync --all-groups --locked --no-editable

      - name: Lint code with Ruff
        run: uv ruff check
        continue-on-error: true

      - name: Run Pylint
        run: uv pylint .
        continue-on-error: true

      - name: Build
        run: uv build

  build-release-wheel:
    name: Build & release wheel ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'master' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_P }}
          role-duration-seconds: 3600

      - name: Authenticate uv with AWS CodeArtifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain konverso \
            --domain-owner 872515286329 \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "UV_INDEX_KONVERSO_AWS_PRIVATE_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PRIVATE_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_KONVERSO_AWS_PYPI_PROXY_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
          echo "UV_PUBLISH_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_PUBLISH_PASSWORD=$TOKEN" >> "$GITHUB_ENV"

      - name: Bump patch version
        run: |
          uv version --bump patch
          NEW_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*["'\''"]([^"'\'']+)["'\''"].*/\1/')
          echo -e "\033[32m++ Bumped patch version to $NEW_VERSION\033[39m"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and push version bump
        run: |
          git config --global user.email "73905580+konversoai@users.noreply.github.com" && git config --global user.name "konversoai"
          git add pyproject.toml uv.lock
          git commit -m "chore(KB-123): bump version to $NEW_VERSION [skip ci]"
          git push

      - name: Install Dependencies
        run: uv sync --all-groups --locked --no-editable

      - name: Build
        run: uv build --wheel

      - name: Publish to AWS CodeArtifact
        run: |
          uv publish --index konverso-aws-private